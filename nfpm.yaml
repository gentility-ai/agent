# Gentility AI Agent Daemon - nfpm configuration
# yaml-language-server: $schema=https://nfpm.goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

name: "gentility-agent"
arch: "amd64"
platform: "linux"
version: "1.2.18"
section: "net"
priority: "optional"
maintainer: "James Tippett - Gentility AI <james@gentility.ai>"
description: |
  Gentility AI Agent Daemon
  An agent that connects to Gentility AI servers to provide
  remote function and automation capabilities.

  Features:
  - Remote command execution
  - Database query execution (PostgreSQL and MySQL)
  - File read/write operations
  - Capability checking and validation
vendor: "Gentility AI"
homepage: "https://gentility.ai"
license: "MIT"

contents:
  # Main binary
  - src: ./bin/gentility-agent
    dst: /usr/bin/gentility
    file_info:
      mode: 0755
      owner: root
      group: root

  # Systemd service file
  - src: ./gentility.service
    dst: /etc/systemd/system/gentility.service
    file_info:
      mode: 0644
      owner: root
      group: root

  - src: ./gentility.yaml.example
    dst: /etc/gentility.yaml.example
    file_info:
      mode: 0644
      owner: root
      group: root

  # Log directory
  - dst: /var/log/gentility-agent
    type: dir
    file_info:
      mode: 0755
      owner: gentility
      group: gentility

  # Data directory
  - dst: /var/lib/gentility-agent
    type: dir
    file_info:
      mode: 0755
      owner: gentility
      group: gentility

  # Script directory
  - dst: /usr/lib/gentility-agent
    type: dir
    file_info:
      mode: 0755
      owner: root
      group: root

  # Sudo management script
  - src: ./scripts/manage-sudo.sh
    dst: /usr/lib/gentility-agent/manage-sudo.sh
    file_info:
      mode: 0755
      owner: root
      group: root

  # Gateway bundle installer: the root helper, the keys it trusts, and the
  # sudoers line that lets the agent run it (installed by postinstall once
  # visudo -c passes). See the gateway bundle contract.
  - src: ./bin/gentility-gateway-install
    dst: /usr/libexec/gentility/gentility-gateway-install
    file_info:
      mode: 0755
      owner: root
      group: root

  - src: ./configs/gateway/keys.json
    dst: /etc/gentility-gateway/keys.json
    file_info:
      mode: 0644
      owner: root
      group: root

  - src: ./configs/gateway/sudoers
    dst: /usr/lib/gentility-agent/gentility-gateway.sudoers
    file_info:
      mode: 0440
      owner: root
      group: root

  # Puts back a move cut off by a reboot, before the proxy starts.
  - src: ./configs/gateway/gentility-gateway-recover.service
    dst: /etc/systemd/system/gentility-gateway-recover.service
    file_info:
      mode: 0644
      owner: root
      group: root

scripts:
  preinstall: ./scripts/preinstall.sh
  postinstall: ./scripts/postinstall.sh
  preremove: ./scripts/preremove.sh
  postremove: ./scripts/postremove.sh
