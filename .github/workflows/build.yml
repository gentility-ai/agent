name: Build and Release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            nfpm_config: nfpm.yaml
            nfpm_arch: amd64
            nfpm_asset: Linux_x86_64
            nfpm_sha256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
          - arch: arm64
            runner: ubuntu-24.04-arm
            nfpm_config: nfpm-arm64.yaml
            nfpm_arch: arm64
            nfpm_asset: Linux_arm64
            nfpm_sha256: a9a75213763783b7669719e505474c748c5ad7dc66591a195619deb50f85c2f4

    runs-on: ${{ matrix.runner }}
    name: Linux ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Crystal
        uses: crystal-lang/install-crystal@36a22e9145188eec527c96e5a789ce4b832af587 # v1.9.5
        with:
          crystal: 1.22.2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libevent-dev \
            libssl-dev \
            libgc-dev \
            libpcre2-dev \
            libxml2-dev \
            libyaml-dev \
            zlib1g-dev

      - name: Install Crystal dependencies
        run: shards install --production

      - name: Build static binary
        run: |
          mkdir -p bin
          crystal build src/agent.cr \
            --release \
            --static \
            --no-debug \
            -o bin/gentility-agent

      - name: Install nfpm
        env:
          NFPM_VERSION: 2.48.0
        run: |
          curl -fsSLo "$RUNNER_TEMP/nfpm.tar.gz" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_${{ matrix.nfpm_asset }}.tar.gz"
          echo "${{ matrix.nfpm_sha256 }}  $RUNNER_TEMP/nfpm.tar.gz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/nfpm.tar.gz" -C /usr/local/bin nfpm

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build DEB package
        run: |
          mkdir -p packages
          nfpm pkg \
            --packager deb \
            --config ${{ matrix.nfpm_config }} \
            --target packages/gentility-agent_${{ steps.version.outputs.version }}_${{ matrix.nfpm_arch }}.deb

      - name: Build RPM package
        run: |
          nfpm pkg \
            --packager rpm \
            --config ${{ matrix.nfpm_config }} \
            --target packages/gentility-agent-${{ steps.version.outputs.version }}.${{ matrix.arch == 'amd64' && 'x86_64' || 'aarch64' }}.rpm

      - name: Create tarball
        run: |
          tar -czf packages/gentility-agent-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.tar.gz \
            -C bin gentility-agent

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: packages/*

  build-macos:
    runs-on: macos-15
    name: macOS arm64

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Crystal
        uses: crystal-lang/install-crystal@36a22e9145188eec527c96e5a789ce4b832af587 # v1.9.5
        with:
          crystal: 1.22.2

      - name: Install Crystal dependencies
        run: shards install --production

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build binary
        run: |
          mkdir -p bin
          crystal build src/agent.cr \
            --release \
            --no-debug \
            -o bin/gentility-agent-${{ steps.version.outputs.version }}-darwin-arm64

      - name: Create tarball
        run: |
          mkdir -p packages
          tar -czf packages/gentility-agent-${{ steps.version.outputs.version }}-darwin-arm64.tar.gz \
            -C bin gentility-agent-${{ steps.version.outputs.version }}-darwin-arm64

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-arm64
          path: packages/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-macos]
    runs-on: ubuntu-24.04
    name: Create Release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: List release artifacts
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
